version: '3.8'

services:
  rag-app:
    container_name: rag-app
    build: .
    ports:
      - "5002:5002"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EMBEDDING_DIM=1536
      - CHROMA_PERSIST_DIR=/app/data/vectordb/chroma
      - CHROMA_COLLECTION_NAME=engineering_qa
      - BM25_INDEX_PATH=/app/data/vectordb/bm25_index.pkl
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - TOP_K_RESULTS=5
      - API_HOST=0.0.0.0
      - API_PORT=5002
      - DEBUG=false
    volumes:
      - ./data:/app/data
    command: sh -c "python scripts/ingest.py && uvicorn app.main:app --host 0.0.0.0 --port 5002"
